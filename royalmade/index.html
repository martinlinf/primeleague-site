<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Royalmade — Make them royal.</title>
  <meta name="description" content="Royalmade is a raising-sim series about making stars. The first game, Royalmade: Megastar, is coming to Steam.">
  <meta name="theme-color" content="#18152A">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="img/favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#">
        <img class="brand-crest" src="img/crest.webp" width="56" height="97" alt="">
        <img class="brand-word" src="img/wordmark.webp" width="220" height="64" alt="Royalmade">
      </a>
      <a class="studio-link" href="../">PRIME LEAGUE</a>
    </div>
  </header>

  <main id="main" class="stage">
    <div class="stage-bg" aria-hidden="true"></div>
    <div class="stage-veil" aria-hidden="true"></div>
    <div class="wrap landing">
      <section class="identity">
        <img class="hero-crest" src="img/crest.webp" width="693" height="1200" alt="Royalmade crest">
        <img class="hero-word" src="img/wordmark.webp" width="1600" height="466" alt="">
        <p class="slogan">Make them royal.</p>
      </section>

      <section class="feature" aria-labelledby="game-title">
        <h1 id="game-title" class="sr-only">Royalmade: Megastar</h1>
        <img class="capsule" src="img/megastar-capsule.webp" width="616" height="353" alt="Royalmade: Megastar">
        <p class="pitch">Run a talent agency and raise ordinary artists into megastars. Scout talent, book gigs, manage the headlines, and outplay rival agencies.</p>
        <button type="button" class="btn" disabled aria-disabled="true">Coming soon to Steam</button>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>© 2026 <a href="../">PRIME LEAGUE LLC</a></p>
    </div>
  </footer>
</body>
</html>
